<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss Grid Analyzer</title>
<style>
[hidden] { display: none !important; }
:root {
  --bg: #f4f5f7; --panel: #ffffff; --ink: #1c2330; --muted: #5d6778; --line: #d9dde5; --accent: #1f5fd1; --accent-ink: #fff;
  --ok: #1b8a4b; --warn: #c27a00; --fail: #c62828; --neutral: #7b8494;
  --l1: #2a9d8f; --l2: #e9a23b; --l3: #4c78c9; --l4: #9b5fc0; --l5: #d2586e; --l6: #6b8e23;
  --grid: #e6e9ef; --grid-major: #d3d8e1; --plan-bg: #fbfcfd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #98a2b3; --line: #2c3340; --accent: #6ea0ff; --accent-ink: #0b1220;
    --ok: #4cc38a; --warn: #f0b34a; --fail: #ff7a7a; --neutral: #8792a5;
    --l1: #44c2b3; --l2: #f0b34a; --l3: #7ea2ee; --l4: #b98be0; --l5: #ee7d93; --l6: #9ec24a;
    --grid: #1f2530; --grid-major: #2a3140; --plan-bg: #151920;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.danger:hover { border-color: var(--fail); color: var(--fail); }
button.x { padding: 0 6px; border: none; background: none; color: var(--muted); }
button.x:hover { color: var(--fail); }
select, input[type=text], input[type=number] { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 3px 5px; max-width: 100%; }
input.num { width: 72px; text-align: right; }
input.w50 { width: 52px; } input.w60 { width: 62px; }
.top { display: flex; align-items: center; gap: 16px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand b { font-size: 15px; } .brand small { color: var(--muted); margin-left: 6px; font-size: 11px; } .brand span { color: var(--muted); margin-left: 10px; }
.tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.tool-sel, .tool-check { display: flex; align-items: center; gap: 4px; color: var(--muted); }
main { --side-w: 420px; --bottom-h: 250px; position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); grid-template-rows: minmax(0, 1fr) var(--bottom-h); gap: 0; }
.split { position: absolute; z-index: 20; background: transparent; touch-action: none; }
.split:hover, .split.drag { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.split-v { top: 0; bottom: 0; width: 8px; left: calc(100% - var(--side-w) - 4px); cursor: col-resize; }
.split-h { height: 8px; left: 0; right: var(--side-w); bottom: calc(var(--bottom-h) - 4px); cursor: row-resize; }
.stage { position: relative; grid-column: 1; grid-row: 1; min-width: 0; min-height: 0; background: var(--plan-bg); border-right: 1px solid var(--line); }
#plan, #iso { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#plan:active, #iso:active { cursor: grabbing; }
.hint { position: absolute; left: 10px; bottom: 8px; color: var(--muted); font-size: 12px; background: color-mix(in srgb, var(--plan-bg) 85%, transparent); padding: 2px 6px; border-radius: 4px; pointer-events: none; }
.legend { position: absolute; right: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
#inspector { grid-column: 2; grid-row: 1 / span 2; overflow: auto; background: var(--panel); padding: 12px; }
#summary { grid-column: 1; grid-row: 2; overflow: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px; min-width: 0; }

/* plan */
.plan-svg { display: block; }
.grid line { stroke: var(--grid); stroke-width: 1; } .grid line.major { stroke: var(--grid-major); }
.truss .body { stroke: var(--neutral); stroke-linecap: butt; }
.truss .hit { stroke: transparent; cursor: move; }
.truss.c-layer-1 .body { stroke: var(--l1); } .truss.c-layer-2 .body { stroke: var(--l2); } .truss.c-layer-3 .body { stroke: var(--l3); }
.truss.c-layer-4 .body { stroke: var(--l4); } .truss.c-layer-5 .body { stroke: var(--l5); } .truss.c-layer-6 .body { stroke: var(--l6); }
.truss.c-ok .body { stroke: var(--ok); } .truss.c-warn .body { stroke: var(--warn); } .truss.c-fail .body { stroke: var(--fail); }
.truss.c-neutral .body, .truss.c-unsolved .body { stroke: var(--neutral); }
.truss.c-unsolved .body { stroke-dasharray: 6 4; }
.truss .body3d { fill: var(--neutral); stroke: rgba(0,0,0,.4); stroke-width: .6; stroke-linejoin: round; }
.truss.c-layer-1 .body3d { fill: var(--l1); } .truss.c-layer-2 .body3d { fill: var(--l2); } .truss.c-layer-3 .body3d { fill: var(--l3); }
.truss.c-layer-4 .body3d { fill: var(--l4); } .truss.c-layer-5 .body3d { fill: var(--l5); } .truss.c-layer-6 .body3d { fill: var(--l6); }
.truss.c-ok .body3d { fill: var(--ok); } .truss.c-warn .body3d { fill: var(--warn); } .truss.c-fail .body3d { fill: var(--fail); }
.truss.c-neutral .body3d, .truss.c-unsolved .body3d { fill: var(--neutral); }
.truss.selected .body3d { stroke: var(--accent); stroke-width: 1.6; }
.truss .shine { stroke: #fff; opacity: .35; pointer-events: none; }
.truss .cant { stroke: var(--plan-bg); stroke-dasharray: 5 4; opacity: .85; }
.truss.selected .body { filter: drop-shadow(0 0 4px var(--accent)); }
.truss.selected .hit { stroke: color-mix(in srgb, var(--accent) 18%, transparent); }
.dim { opacity: .22; }
.lbl { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--plan-bg); stroke-width: 3px; }
.lbl.small { font-size: 10px; fill: var(--muted); } .lbl.name { font-weight: 600; }
.hoist circle { fill: var(--panel); stroke-width: 2.5; cursor: pointer; }
.hoist.c-ok circle { stroke: var(--ok); } .hoist.c-warn circle { stroke: var(--warn); } .hoist.c-fail circle { stroke: var(--fail); fill: color-mix(in srgb, var(--fail) 25%, var(--panel)); }
.hoist.selected circle { stroke-width: 4; }
.hoist-lbl { font-weight: 600; }
.bear { fill: var(--ink); opacity: .85; }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.mismatch { stroke: var(--fail); stroke-dasharray: 3 3; stroke-width: 1.5; }
.arrow { fill: var(--ink); } .load.ghost { opacity: .5; }
.marks .load, .marks .lbl, .marks .bear, .marks .mismatch, .ring { pointer-events: none; }

/* inspector */
.ins-head { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.title-input { font-size: 16px; font-weight: 600; flex: 1; min-width: 0; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.grid2, .grid3 { display: grid; gap: 8px; margin: 8px 0; } .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 2px; min-width: 0; } .field span { color: var(--muted); font-size: 11px; }
.field select, .field input.num { width: 100%; } .field.check input { width: 18px; height: 18px; }
h4 { margin: 14px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sub { color: var(--muted); font-size: 12px; margin: 4px 0; }
.note.fail { color: var(--fail); margin: 8px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
.chip.ok { border-color: var(--ok); color: var(--ok); } .chip.fail { border-color: var(--fail); color: var(--fail); font-weight: 600; }
.elev-wrap { border: 1px solid var(--line); border-radius: 8px; padding: 4px; background: var(--plan-bg); }
.elev { width: 100%; height: auto; display: block; }
.elev .eb.ok { fill: var(--ok); opacity: .75; } .elev .eb.cant { fill: var(--l2); opacity: .8; } .elev .eb.fail { fill: var(--fail); }
.elev .et { font-size: 10px; fill: var(--ink); } .elev .et.small { fill: var(--muted); font-size: 9px; } .elev .et.strong { font-weight: 700; font-size: 11px; } .elev .et.fail { fill: var(--fail); font-weight: 700; }
.elev .el { fill: var(--ink); } .elev .el.ghost { opacity: .5; } .elev .el.inj { fill: var(--accent); }
.elev .es.hoist { fill: var(--l3); } .elev .es.bear { fill: var(--ink); }
.elev-wrap + .elev-wrap { margin-top: 6px; }
.forces .axis { stroke: var(--muted); stroke-width: 1; } .forces .limit { stroke: var(--fail); stroke-width: 1; stroke-dasharray: 4 3; opacity: .7; }
.forces .fd { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.2; }
.forces .fd.over { fill: color-mix(in srgb, var(--fail) 22%, transparent); stroke: var(--fail); }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 2px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.r { text-align: right; font-variant-numeric: tabular-nums; } .tbl td.center { text-align: center; }
.tbl tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.tbl.hoists tbody tr { cursor: pointer; } .tbl.hoists tbody tr:hover td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.detail { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; } .detail select { max-width: 150px; }
.mini { font-size: 11px; color: var(--muted); } .mini.check { display: flex; align-items: center; gap: 2px; }
.note { width: 100%; }
input.note { width: 100%; }
.fxpick { display: flex; gap: 4px; } .fxpick select { max-width: 150px; }
.badge { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid; }
.badge.ok { color: var(--ok); border-color: var(--ok); } .badge.warn { color: var(--warn); border-color: var(--warn); } .badge.fail { color: var(--fail); border-color: var(--fail); }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
.sum-head { display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 6px; }
.kpi b { font-size: 20px; display: block; line-height: 1.1; } .kpi span { color: var(--muted); font-size: 11px; } .kpi.fail b { color: var(--fail); } .kpi.ok b { color: var(--ok); }
.warnings { margin: 4px 0 8px; padding-left: 18px; color: var(--fail); } .warnings li { cursor: pointer; }
dialog { max-width: 720px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
dialog::backdrop { background: rgba(0,0,0,.4); }
@media (max-width: 900px) { .split { display: none; } main { grid-template-columns: 1fr; grid-template-rows: 55vh auto 260px; } #inspector { grid-column: 1; grid-row: 2; } #summary { grid-column: 1; grid-row: 3; } }
@media print { .top, #inspector, .hint, .legend { display: none; } main { display: block; } #plan { position: static; height: 60vh; } #summary { overflow: visible; } }

/* iso + tools */
.iso .shadow { stroke: var(--ink); opacity: .08; }
.iso .chain { stroke: var(--muted); stroke-width: 1.2; opacity: .7; }
.iso .link { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 2 2; }
.iso .arrow.ghost { opacity: .5; }
.iso .hoist circle { stroke-width: 2.5; }
.tabs { display: flex; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 7px 12px; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
#page { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; }
#page .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; max-width: 900px; }
#page h2 { margin: 0 0 8px; font-size: 16px; } #page h3 { margin: 12px 0 6px; font-size: 13px; }
.formrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin: 8px 0; }
.result-big { font-size: 28px; font-weight: 700; } .result-big small { font-size: 13px; font-weight: 400; color: var(--muted); }
.msg { color: var(--fail); font-weight: 600; margin: 4px 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; max-width: 1100px; }
.tbl.wide td, .tbl.wide th { padding: 4px 8px; }
.viewctl { position: absolute; left: 10px; top: 10px; display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }

.blk { fill: var(--ink); opacity: .9; stroke: var(--plan-bg); stroke-width: 1.5; cursor: pointer; }
.blk.bad { fill: var(--fail); }
.blockg.selected .blk { stroke: var(--accent); stroke-width: 3; }
.blockg.dim { opacity: .3; }

.poscell { display: flex; gap: 2px; align-items: center; }
.poscell select.ref { padding: 2px 1px; font-size: 11px; max-width: 58px; }
.linelen { margin: 2px 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.linelen b { color: var(--ink); }
.blockpick { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.blockpick select { width: 100%; }

button.del { padding: 1px 6px; font-size: 11px; color: var(--muted); }
button.del:hover { color: var(--fail); border-color: var(--fail); }

.layout { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 8px; margin: 6px 0 10px; background: var(--plan-bg); }
.layout h4 { margin-top: 8px; }
.seqrows { display: flex; flex-direction: column; gap: 2px; }
.seg { display: flex; align-items: center; gap: 6px; padding-left: 22px; }
.seg .mini { min-width: 110px; }
.cbrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.cbmark { width: 12px; height: 12px; background: var(--ink); border-radius: 2px; display: inline-block; }

.pieces { margin: 2px 0 6px 22px; }
.ptags { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0; }
.ptag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; background: var(--panel); cursor: pointer; font-variant-numeric: tabular-nums; }
.ptag i { font-style: normal; color: var(--muted); }
.ptag:hover { border-color: var(--fail); } .ptag:hover i { color: var(--fail); }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
button.chip-btn { padding: 1px 7px; font-size: 12px; border-radius: 999px; }
.segbox { border-top: 1px dashed var(--line); padding-top: 2px; }

.notation { font-weight: 600; margin: 4px 0 8px; font-variant-numeric: tabular-nums; word-break: break-word; }
button.cb-ins { padding: 0 5px; font-size: 10px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); background: none; }
button.cb-ins:hover { color: var(--ink); border-color: var(--accent); }

.rules { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 8px; }

.tbl td.hi { color: var(--warn); font-weight: 700; }

details.grp { border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; background: color-mix(in srgb, var(--panel) 92%, var(--ink) 3%); }
details.grp > summary { cursor: pointer; padding: 6px 10px; display: flex; align-items: center; gap: 8px; font-weight: 600; list-style: none; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; border-left: 6px solid var(--muted); border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform .12s; }
details.grp[open] > summary::before { transform: rotate(90deg); }
details.grp > summary .grp-n { margin-left: auto; font-weight: 400; font-size: 11px; color: var(--muted); }
details.grp[open] > summary { border-bottom: 1px solid var(--line); }
.grp-body { padding: 4px 10px 8px; }
.grp-body > h4:first-child { display: none; }
.grp-tools { display: flex; gap: 12px; justify-content: flex-end; margin: -2px 0 0; }
button.lnk { border: 0; background: none; color: var(--accent); padding: 0; font-size: 11px; cursor: pointer; }

.tbl th.r { text-align: right; }
.tbl.hoists th, .tbl.hoists td { white-space: nowrap; }
.tbl.hoists { display: block; overflow-x: auto; }

.tbl.loads td:last-child { white-space: nowrap; }
.tbl td.nowrap { white-space: nowrap; }
input.cbname { width: 110px; font-weight: 600; }
.quick { display: flex; gap: 6px; margin: 4px 0 2px; flex-wrap: wrap; }
.drag { cursor: grab; color: var(--muted); font-size: 16px; padding: 0 4px; user-select: none; }
.tbl th.sortable { cursor: pointer; text-decoration: underline dotted; }
.tbl tr.dragging { opacity: .4; } .tbl tr.dropat td { border-top: 2px solid var(--accent); }
input.num.bad { outline: 2px solid var(--fail); }
input.fxsearch { min-width: 220px; flex: 1; }
.fxpick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
input.fxsearch.bad { outline: 2px solid var(--fail); }

</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Truss Grid Analyzer</b><small id="appver"></small><span id="rigname"></span></div>
  <div class="tools">
    <button id="b-new" title="Start an empty rig">New</button>
    <button id="b-sample" title="Load the illustrative example box">Example</button>
    <button id="b-open">Open</button>
    <button id="b-save">Save</button>
    <input type="file" id="f-open" accept=".json,application/json" hidden>
    <span class="sep"></span>
    <button id="b-undo" title="Ctrl+Z">Undo</button>
    <button id="b-redo" title="Ctrl+Y">Redo</button>
    <span class="sep"></span>
    <button id="b-add" class="primary">+ Truss</button>
    <button id="b-fit">Fit</button>
    <label class="tool-sel">Color <select id="s-color">
      <option value="layer">Load-path layer</option>
      <option value="util">Utilization</option>
      <option value="hoist">Hoist load</option>
      <option value="status">Pass / fail</option>
    </select></label>
    <label class="tool-check"><input type="checkbox" id="c-loads" checked> Loads</label>
    <label class="tool-check"><input type="checkbox" id="c-labels" checked> Labels</label>
    <span class="sep"></span>
    <button id="b-csv">Copy hoist table</button>
    <button id="b-img" title="Save the current view as a PNG image">Save image</button>
    <button id="b-print">Print</button>
    <button id="b-docs">About</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="plan" class="on">Plan view</button>
  <button data-tab="iso">3D view</button>
  <button data-tab="circular">Circular truss</button>
  <button data-tab="udl">Simple UDL</button>
  <button data-tab="fixtures">Fixture weights</button>
  <button data-tab="databases">Databases</button>
</nav>
<main id="main">
  <section class="stage">
    <div id="plan"></div>
    <div id="iso" hidden></div>
    <div class="viewctl" id="isoctl" hidden>3D view <label>Rotate <input type="range" id="r-yaw" min="-180" max="180" value="35"></label> <label>Tilt <input type="range" id="r-pitch" min="5" max="85" value="32"></label> <span>drag = orbit, shift+drag = pan</span></div>
    <div id="legend" class="legend"></div>
    <div class="hint">Drag trusses to move (ends snap; hold Alt to disable). Wheel = zoom, drag background = pan. Click a motor to trace its load path; Delete removes the selected motor (or the selected truss).</div>
  </section>
  <aside id="inspector"></aside>
  <section id="summary"></section>
</main>
<section id="page" hidden></section>
<dialog id="docs"></dialog>
<script>
/* App version (MAJOR.MINOR.PATCH). MAJOR is set by the owner; MINOR (new features, or any change to calculated
 * results) and PATCH (fixes that don't change results, UI and text) are bumped with each change. Newest first.
 * Shown in the header and the About dialog, and written into saved rig files. The original program's license asks
 * every modified version's history to show who made the change, when, and what changed: [version, date, who, what]. */
(function (g) {
  var TLA = (g.TLA = g.TLA || {});
  TLA.VERSION = "1.2.0";
  TLA.CHANGES = [
    ["1.2.0", "2026-09-22", "G.E. Simmons Falk", "Shear and bending-moment diagrams for every truss, and a moment/shear check against an allowable moment and shear estimated from the manufacturer's tables. It catches what the span-by-span table check can't: bending over the supports of a continuous truss, and heavy loads right next to a support. Can flag trusses the table check passed. The 'count truss weight' option now also applies to this check."],

/* Single-truss continuous beam engine (three-moment equation). Pure functions, no DOM.

  /** Solve tridiagonal system (sub a, diag b, super c, rhs d) with the Thomas algorithm. */

      dp[i] = (d[i] - a[i] * dp[i - 1]) / m;

    for (var j = n - 2; j >= 0; j--) x[j] = dp[j] - cp[j] * x[j + 1];

  /**

    });

      length: length, w: w, wSelf: wSelf, wDist: wDist,
      positions: P, sortedReactions: R, reactions: reactions, moments: M,
      left: { length: leftLen, V: Vleft, M: M1, sumF: left.F },
      right: { length: rightLen, V: Vright, M: Mn, sumF: right.F },
      spans: spans, loads: loads, totalLoad: totalLoad,
      equilibriumError: R.reduce(function (t, r) { return t + r; }, 0) - totalLoad,
      warnings: warnings
    };
  }

  /**
   * Shear and bending moment along a solved beam (statics from its reactions, loads and uniform load).
   * Sign convention: sagging moment positive (hogging over supports is negative); shear is the upward force on the
   * part to the left of the cut. Returns points at every support, load and end (shear just left and just right of
   * each), plus the peak of each uniformly loaded stretch; and the extremes.

  var DOCS = [
    "<h2>Truss Grid Analyzer " + TLA.VERSION + "</h2>",
    "<p>A rebuild of <b>Truss Load Analyzer - EOT</b>, created by <b>Delbert L. Hall and Jon Sogoian</b> (open-source freeware, based on their original program by Delbert Hall). The truss, chain hoist and fixture data come from their workbook. This version adds a truss-grid model where trusses are bolted to each other and hung from hoists.</p>",
    "<h3>Disclaimer</h3><p>This tool is intended for use by entertainment rigging professionals to assist them in making rigging decisions. Every attempt has been made to be accurate. However, the authors of the original program and of this rebuild are not responsible for errors in the program or the results of its use. <b>Users are responsible for verifying the results before using them to make rigging decisions.</b></p>",
    "<h3>Method and assumptions</h3><ul>",
    "<li>Each truss is a continuous beam with cantilevers, solved with Clapeyron's three-moment equation; reactions at supports are exact for the entered loads.</li>",
    "<li>Where a truss is bolted to another truss, its end reaction at that connection (plus any hardware weight, such as a corner block) is passed to the connected truss as a point load. Trusses are solved in order along the load path down to the hoists. Loops (A bolted to B and B bolted to A) are flagged, not solved. This matches how the original workbooks linked trusses; it does not model the moment stiffness of a rigid bolted box, which would need a full frame analysis.</li>",
    "<li>Span and cantilever limits use the manufacturer tables, rounding the span up to the next foot. Maximum cantilever is one quarter of the maximum span. Point-load capacity of a span is the tabulated center point load, reduced by the share of the UDL capacity already used by any wall weight.</li>",
    "<li><b>Checked against Rigging Math Made Simple</b> (Delbert L. Hall): reactions are the statics equations from the book (load x distance to the opposite leg / span, cantilever loads subtract on the far leg, truss weight added as a load at the center of the span and of each cantilever); a span is not overloaded if the point loads on it do not exceed the table CPL for that span, reduced by the share of the UDL capacity already used by any wall weight; a cantilever must be no longer than a quarter of the maximum span and carry no more than the CPL for a span four times the cantilever length. Manufacturers' tables already subtract the truss weight, so the truss's own weight is not counted against those limits unless you tick the stricter option below the plan.</li>",
    "<li><b>Stiffness check</b>: the load-path method treats every truss that carries another as an unyielding support. That is exact when the carrying truss is held up at each connection, but if a truss with its own hoist is bolted to a carrier that has no hoist near the connection, the carrier sags and the bolted truss sheds load to its own hoist, which the load-path method under-estimates (in a test rig by more than 2 times). So the app also solves the whole rig with the grillage method: a matrix (direct-stiffness) analysis of the box as beams meeting at the corner blocks, the standard technique for a bolted grid such as a bridge deck. Since no manufacturer publishes a stiffness for the corner-block hardware itself, two joint models bracket it - hinged (the bolt carries vertical force only) and rigid (bending and torsion also pass through the block, the textbook grillage assumption, and the one an independent 3D frame analysis of a similar grid also implies) - and the Worst case column shows the larger of the two. Each truss's bending (EI) and torsional (GJ) stiffness is estimated from its published size and its connector type (plated/bolted trusses are more flexible than spigoted ones of the same size, and lose more of their torsional stiffness through a bolted joint); scale a truss's estimate with its Stiffness (x) field. Hoists are treated as rigid supports.</li>",
    "<li><b>Moment and shear check</b>: the span and cantilever checks compare each span on its own with the tables. A continuous truss also bends over its supports (hogging) from loads in the next span, and a heavy load right beside a support puts most of its weight into shear. So the bending moment and shear are also worked out all along the truss (shown under its diagram) and compared with an allowable moment and shear <b>estimated from the manufacturer's tables</b>: every table entry is a load the maker says the truss carries, so it demonstrates a moment (point load x span / 4, or uniform load x span / 8) and a shear (half the load). The allowable moment is the largest the tables demonstrate - the smaller of the point-load and uniform-load figures - and the allowable shear the largest shear any entry demonstrates (a safe-side estimate), both with the repetitive-use factor. These are estimates, not published values; use the maker's published moment and shear where you have them. Truss self weight is left out, as in the tables, unless you tick the stricter option below the plan.</li>",
    "<li><b>Slack hoists</b>: a chain can only pull. If the loads would push a hoist up (a negative reaction - typically a hoist next to a heavily loaded span or cantilever), its chain goes slack: the hoist is shown as <b>Slack</b>, carries only its own weight, and the truss is solved again without it, so the other hoists and the span checks see the real, longer spans. If that leaves a truss with a single support point, it would tip: it is flagged <b>UNSTABLE</b> and its numbers must not be used.</li>",
    "<li>Loads are based on ANSI repetitive-use rules: capacities are multiplied by 0.85 unless the truss data is marked as already including the repetitive-use factor.</li>",
    "<li>Hoist status compares the <b>static</b> load with capacity (as the original). Dynamic load = static x the hoist's dynamic load factor (speed fpm / 64 + 1, so 16 fpm = 1.25; a hoist with no listed speed uses the default 1.25, and any hoist can be given its own factor) and is flagged separately when it exceeds capacity.</li>",
    "<li><b>Cantilever</b>: the part of a truss that extends past its outermost support (a hoist or a bolted connection). The ANSI standards supplied (E1.2 and others) do not define it; the tool uses the rule in the original workbook and in manufacturer guidance: the maximum cantilever is one quarter of the maximum span, and the load on a cantilever must not exceed the manufacturer's center point load (CPL) for a span four times the cantilever length. Span (ANSI E1.2, 2.33) is the distance between support points.</li>",
    "<li><b>Corner blocks</b>: trusses are bolted together at corner blocks, which are special short trusses with their own weight. The block type comes from the Christie Lites and James Thomas Engineering catalogues (weights as published on their product pages; blocks that use end/face plates add weight per truss bolted on, and bolt-on blocks default to the middle published bolt count). The truss it is bolted through carries the block, and every truss bolted to it passes its end reaction into the block. Faces used are counted (a truss ending at the block uses 1, one running through it uses 2) and compared with the block's ways. Where a maker publishes no weight, enter your own on the block. Truss lengths are measured center to center of the blocks in the plan.</li>",

    "<li>Mirror loads: a load can be mirrored about the truss centerline; the twin follows edits to the original.</li></ul>",
    "<h3>Version history</h3><ul>" + TLA.CHANGES.map(function (c) { return "<li><b>" + c[0] + "</b> (" + c[1] + ", " + c[2] + "): " + c[3] + "</li>"; }).join("") + "</ul>",

      r.readAsText(f); e.target.value = "";
    };
    $("b-docs").onclick = function () { var d = $("docs"); d.innerHTML = DOCS; d.showModal(); $("docs-close").onclick = function () { d.close(); }; };
    $("appver").textContent = "v" + TLA.VERSION;
    $("rigname").ondblclick = function () { var n = prompt("Rig name", S.rig.name); if (n) { S.rig.name = n; S.commit(); } };

    document.addEventListener("keydown", function (e) {
      var tag = (e.target && e.target.tagName) || "";
      if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? S.redo() : S.undo(); }
      else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); S.redo(); }
      else if ((e.key === "Delete" || e.key === "Backspace") && S.sel.truss && S.sel.support) { e.preventDefault(); S.removeSupport(S.sel.truss, S.sel.support); }
      else if ((e.key === "Delete" || e.key === "Backspace") && S.sel.truss) { var t = S.truss(S.sel.truss); if (t && confirm("Delete " + t.name + "?")) S.removeTruss(t.id); }
      else if (e.key.toLowerCase() === "r" && S.sel.truss) { var t2 = S.truss(S.sel.truss); if (t2) { t2.angle = ((t2.angle || 0) + 90) % 360; S.commit(); } }
    });

    S.emit();
    if (S.ui.fit) { S.ui.fit = false; TLA.plan.fit(); }
  }

  /** Rasterise the visible plan/3D SVG to a PNG (styles inlined so it is self-contained). */
  function saveImage() {
    var host = S.ui.tab === "iso" ? $("iso") : $("plan"), src = host.querySelector("svg");
    if (!src) return;
    var clone = src.cloneNode(true), a = src.querySelectorAll("*"), b = clone.querySelectorAll("*");
    var props = ["fill", "stroke", "stroke-width", "stroke-dasharray", "opacity", "font-size", "font-weight", "paint-order", "text-anchor", "stroke-linecap"];
    for (var i = 0; i < a.length; i++) {
      var cs = getComputedStyle(a[i]), st = "";
      props.forEach(function (p) { st += p + ":" + cs.getPropertyValue(p) + ";"; });
      b[i].setAttribute("style", st);
    }
    var W = src.getAttribute("width"), H = src.getAttribute("height");
    clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
    var bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("width", W); bg.setAttribute("height", H); bg.setAttribute("fill", getComputedStyle(host).backgroundColor === "rgba(0, 0, 0, 0)" ? "#ffffff" : getComputedStyle(host).backgroundColor);
    clone.insertBefore(bg, clone.firstChild);
    var url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)], { type: "image/svg+xml" }));
    var img = new Image();
    img.onload = function () {
      var c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
      var ctx = c.getContext("2d"); ctx.scale(2, 2); ctx.drawImage(img, 0, 0);
      c.toBlob(function (blob) {
        var l = document.createElement("a"); l.href = URL.createObjectURL(blob);
        l.download = (S.rig.name || "rig").replace(/[^\w\- ]+/g, "") + (S.ui.tab === "iso" ? "-3d" : "-plan") + ".png"; l.click();
      });
    };
    img.src = url;
  }
  function flash(id, text) { var b = $(id), old = b.textContent; b.textContent = text; setTimeout(function () { b.textContent = old; }, 1200); }

  window.addEventListener("DOMContentLoaded", init);
})(typeof globalThis !== "undefined" ? globalThis : window);
