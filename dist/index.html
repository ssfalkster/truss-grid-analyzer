<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truss Grid Analyzer</title>
<script>try { var th = localStorage.getItem("tla-theme"); if (th === "light" || (th === "system" && matchMedia("(prefers-color-scheme: light)").matches)) document.documentElement.setAttribute("data-theme", "light"); } catch (e) { /* storage unavailable: dark */ }</script>
<style>
[hidden] { display: none !important; }
/* 1.18.0: dark by default (backstage), light on request; File > Theme sets data-theme on <html> */
:root {
  color-scheme: dark;
  --bg: #0e1116; --panel: #151a21; --panel-2: #1a2029; --ink: #e4e8ee; --ink-2: #c3cad5; --muted: #8b95a6; --line: #262d38; --line-2: #1f252e;
  --accent: #5b92ff; --accent-soft: rgba(91,146,255,.14); --accent-ink: #0b1220;
  --ok: #45c07f; --warn: #f0b34a; --fail: #ff6b6b; --neutral: #737e90;
  --l1: #44c2b3; --l2: #f0b34a; --l3: #7ea2ee; --l4: #b98be0; --l5: #ee7d93; --l6: #9ec24a;
  --grid: #171c24; --grid-major: #212834; --plan-bg: #10141a; --truss: #c9d1dc; --hoist: #eef1f5;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --shadow: 0 8px 24px rgba(0,0,0,.35);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef0f3; --panel: #ffffff; --panel-2: #f5f6f8; --ink: #161b24; --ink-2: #3a4352; --muted: #636c7d; --line: #d6dae1; --line-2: #e7eaee;
  --accent: #1f5fd1; --accent-soft: rgba(31,95,209,.10); --accent-ink: #fff;
  --ok: #1b8a4b; --warn: #b87300; --fail: #c62828; --neutral: #7b8494;
  --l1: #2a9d8f; --l2: #e9a23b; --l3: #4c78c9; --l4: #9b5fc0; --l5: #d2586e; --l6: #6b8e23;
  --grid: #e9ecf0; --grid-major: #d6dbe2; --plan-bg: #fbfcfd; --truss: #2f3a4a; --hoist: #1c2330;
  --shadow: 0 8px 24px rgba(20,30,50,.18);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 12.5px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
button, select, input, textarea { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer; color: var(--ink-2); min-height: 26px; }
button:hover { border-color: var(--accent); color: var(--ink); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; border-color: transparent; }
button.ghost:hover { background: var(--panel-2); border-color: var(--line); }
button.icon { width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
button.danger:hover { border-color: var(--fail); color: var(--fail); }
button.x { padding: 0 6px; border: none; background: none; color: var(--muted); min-height: 0; }
button.x:hover { color: var(--fail); }
select, input[type=text], input[type=number], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 2px 6px; max-width: 100%; color: var(--ink); min-height: 26px; }
select:focus, input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.num { width: 72px; text-align: right; font-family: var(--mono); font-size: 12px; }
input.w50 { width: 56px; } input.w60 { width: 66px; }
.kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.lbl-sm { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.vr { width: 1px; height: 20px; background: var(--line); margin: 0 3px; flex: none; }
.grow { flex: 1; }
.segc { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); flex: none; }
.segc button { border: 0; border-radius: 0; background: transparent; padding: 0 10px; min-height: 26px; color: var(--muted); border-right: 1px solid var(--line); }
.segc button:last-child { border-right: 0; }
.segc button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

/* ---------- app bar ---------- */
.appbar { height: 44px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); white-space: nowrap; }
.appbar > * { flex-shrink: 0; }
.appbar .grow { flex-shrink: 1; }
.logo { display: flex; align-items: baseline; gap: 7px; padding-right: 4px; }
.logo b { font-size: 13.5px; }
.logo small { font: 10.5px var(--mono); color: var(--muted); }
#rigname { border-color: transparent; background: transparent; color: var(--ink-2); max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
#rigname:hover { background: var(--panel-2); border-color: var(--line); }
.verdict { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: transparent; }
.verdict .ok { color: var(--ok); font-weight: 700; } .verdict .fail { color: var(--fail); font-weight: 700; } .verdict .w { color: var(--warn); font-weight: 600; } .verdict .m { color: var(--muted); }
.menu { position: relative; }
.pop { position: absolute; top: 32px; left: 0; min-width: 230px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 4px; z-index: 60; }
.pop.right { left: auto; right: 0; }
.pop button { display: flex; width: 100%; justify-content: space-between; gap: 16px; border: 0; background: none; text-align: left; padding: 5px 10px; color: var(--ink-2); }
.pop button:hover { background: var(--accent-soft); color: var(--ink); }
.pop button small { color: var(--muted); }
.pop button.on::after { content: "✓"; color: var(--accent); }
.pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.pop .hd { padding: 6px 10px 2px; }

/* ---------- workspace ---------- */
main { --side-w: 400px; --bottom-h: 330px; position: relative; flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--side-w); grid-template-rows: minmax(0, 1fr) var(--bottom-h); gap: 0; }
.split { position: absolute; z-index: 20; background: transparent; touch-action: none; }
.split:hover, .split.drag { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.split-v { top: 0; bottom: 0; width: 8px; left: calc(100% - var(--side-w) - 4px); cursor: col-resize; }
.split-h { height: 8px; left: 0; right: var(--side-w); bottom: calc(var(--bottom-h) - 4px); cursor: row-resize; }
.stage { position: relative; grid-column: 1; grid-row: 1; min-width: 0; min-height: 0; background: var(--plan-bg); overflow: hidden; }
#plan, #iso { position: absolute; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#plan:active, #iso:active { cursor: grabbing; }
body.picking #plan { cursor: crosshair; }
#inspector { grid-column: 2; grid-row: 1 / span 2; overflow-y: auto; overflow-x: hidden; background: var(--panel); border-left: 1px solid var(--line); }
#dock { grid-column: 1; grid-row: 2; background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#summary { flex: 1; overflow: auto; min-height: 0; }
/* loads focus (1.18.0): typing in the Loads grid shrinks the plan to a strip of the truss being edited */
main.focus { grid-template-rows: 118px minmax(0, 1fr); }
main.focus .split-h { display: none; }
main.focus .stage > :not(#strip):not(.ctool) { display: none; }
main.focus .ctool > :not(.stages):not(#b-add) { display: none; }
#strip { position: absolute; left: 12px; right: 12px; top: 48px; }
#strip .sh { display: flex; gap: 8px; align-items: center; font-size: 12px; }
#strip svg { width: 100%; height: 56px; display: block; }
#strip .sb { fill: var(--ok); opacity: .85; } #strip .scb { fill: var(--ink); } #strip .sl { fill: var(--muted); } #strip .sl.m { opacity: .45; } #strip .sa { fill: var(--accent); }
#strip .sh2 { fill: var(--panel); stroke: var(--ok); stroke-width: 2; }
#strip text { font: 10px var(--mono); fill: var(--muted); } #strip text.a { fill: var(--accent); font-weight: 700; } #strip .cl { stroke: var(--muted); stroke-dasharray: 3 3; }

/* canvas toolbar + overlays */
.ctool { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; z-index: 5; pointer-events: none; }
.ctool > * { pointer-events: auto; }
.ctool .box { display: flex; gap: 6px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-2); padding: 0 6px; min-height: 26px; cursor: pointer; }
.chk input { margin: 0; accent-color: var(--accent); }
.stages { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; background: var(--panel); box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.stages button { display: flex; align-items: center; gap: 7px; padding: 0 12px 0 8px; min-height: 30px; border: 0; border-radius: 0; border-right: 1px solid var(--line); background: var(--panel); color: var(--muted); }
.stages button:last-child { border-right: 0; }
.stages button i { font-style: normal; width: 17px; height: 17px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font: 600 10px var(--mono); }
.stages button small { color: var(--muted); font: 10.5px var(--mono); }
.stages button small.w { color: var(--warn); } .stages button small.f { color: var(--fail); }
.stages button.done i { background: var(--ok); border-color: var(--ok); color: var(--panel); }
.stages button.on { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.stages button.on i { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.legend { position: absolute; right: 10px; top: 52px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; font-size: 11.5px; display: flex; flex-direction: column; gap: 3px; color: var(--ink-2); z-index: 4; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.zoomctl { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 5; }
.hint { position: absolute; left: 10px; bottom: 10px; color: var(--muted); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); padding: 2px 10px; border-radius: 999px; z-index: 4; max-width: calc(100% - 70px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modebar { position: absolute; bottom: 44px; left: 50%; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); border-radius: 4px; padding: 5px 12px; font-weight: 600; z-index: 6; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); }
.modebar button { background: transparent; color: var(--accent-ink); border-color: currentColor; min-height: 22px; padding: 0 8px; }

/* plan */
.plan-svg { display: block; }
.grid line { stroke: var(--grid); stroke-width: 1; } .grid line.major { stroke: var(--grid-major); }
.grid line.origin { stroke: var(--muted); stroke-width: 1.6; opacity: .75; }
.grid .olbl { font: 600 10px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--plan-bg); stroke-width: 3px; }
.truss .body { stroke: var(--neutral); stroke-linecap: butt; }
.truss .hit { stroke: transparent; cursor: move; }
.truss.c-ok .body { stroke: var(--ok); } .truss.c-warn .body { stroke: var(--warn); } .truss.c-fail .body { stroke: var(--fail); }
.truss.c-neutral .body, .truss.c-unsolved .body { stroke: var(--neutral); }
.truss.c-unsolved .body { stroke-dasharray: 6 4; }
.truss .body3d { fill: var(--neutral); stroke: rgba(0,0,0,.4); stroke-width: .6; stroke-linejoin: round; }
.truss.c-ok .body3d { fill: var(--ok); } .truss.c-warn .body3d { fill: var(--warn); } .truss.c-fail .body3d { fill: var(--fail); }
.truss.c-neutral .body3d, .truss.c-unsolved .body3d { fill: var(--neutral); }
.truss.selected .body3d { stroke: var(--accent); stroke-width: 1.6; }
.truss .shine { stroke: #fff; opacity: .35; pointer-events: none; }
.truss .cant { stroke: var(--plan-bg); stroke-dasharray: 5 4; opacity: .85; }
.truss.selected .body { filter: drop-shadow(0 0 4px var(--accent)); }
.truss.selected .hit { stroke: color-mix(in srgb, var(--accent) 22%, transparent); }
.dim { opacity: .22; }
.plan-svg.st1 .marks .load, .plan-svg.st1 .hoist { opacity: .25; }
.plan-svg.st2 .hoist { opacity: .25; } .plan-svg.st2 .arrow { fill: var(--accent); }
.lbl { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--plan-bg); stroke-width: 3px; }
.lbl.small { font-size: 10px; fill: var(--muted); } .lbl.name { font-weight: 600; fill: var(--ink-2); }
.hoist circle { fill: var(--panel); stroke-width: 2.5; cursor: grab; }
.lbl.drag-lbl { font-weight: 700; fill: var(--accent); }
.hoist.c-ok circle { stroke: var(--hoist); } .hoist.c-warn circle { stroke: var(--warn); } .hoist.c-fail circle { stroke: var(--fail); fill: color-mix(in srgb, var(--fail) 25%, var(--panel)); }
.hoist.selected circle { stroke-width: 4; stroke: var(--accent); }
/* 1.18.0: a hoist that is OK is drawn in the ink colour so it reads against a green truss; amber / red when high or overloaded */
.hoist { --hc: var(--hoist); } .hoist.c-warn { --hc: var(--warn); } .hoist.c-fail { --hc: var(--fail); } .hoist.selected { --hc: var(--accent); }
.lbl.hoist-dyn { font-size: 10px; font-style: italic; font-weight: 400; fill: var(--muted); }
.hoist .hsym { fill: var(--panel); stroke: var(--hc); stroke-width: 2.5; cursor: grab; }
.hoist.hung .hsym { stroke-dasharray: 4 2.5; }
.hoist.dead .hline, .hoist.dead .hhalo { display: none; } .hoist.dead .hsym { fill: var(--hc); } .hoist.dead .hdot { fill: var(--panel); }
.hoist .hhalo { stroke: var(--plan-bg); stroke-width: 6; fill: none; stroke-linecap: round; }
.hoist .hline { stroke: var(--hc); stroke-width: 2.2; fill: none; stroke-linecap: round; }
.hoist .hdot { fill: var(--hc); stroke: none; }
.hotglow { pointer-events: none; mix-blend-mode: screen; }
:root[data-theme="light"] .hotglow { mix-blend-mode: multiply; }
.hoist-lbl { font-weight: 700; }
.bear { fill: var(--ink); opacity: .85; }
.ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.selring { fill: none; stroke: var(--accent); stroke-width: 2; pointer-events: none; }
.pickbox { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 4 3; cursor: pointer; }
.pickbox:hover { fill: color-mix(in srgb, var(--accent) 40%, transparent); }
.mismatch { stroke: var(--fail); stroke-dasharray: 3 3; stroke-width: 1.5; }
.bear.fam-warn { fill: var(--fail); stroke: var(--fail); }
.arrow { fill: var(--ink-2); } .load.ghost { opacity: .5; } .load.sel .arrow { fill: var(--accent); }
.marks .load, .marks .lbl, .marks .bear, .marks .mismatch, .ring { pointer-events: none; }

/* ---------- inspector ---------- */
.crumb { display: flex; align-items: center; gap: 6px; padding: 8px 14px 0; font-size: 11.5px; color: var(--muted); }
.crumb a { color: var(--accent); cursor: pointer; }
.crumb .kind { margin-left: auto; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; }
.ins-head { padding: 4px 14px 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.ins-head .t { display: flex; align-items: center; gap: 8px; }
.title-input { font-size: 15px; font-weight: 600; flex: 1; min-width: 0; border-color: transparent !important; background: transparent !important; padding: 0 4px; }
.title-input:hover { border-color: var(--line) !important; }
.ins-head .meta { color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; padding-left: 4px; }
.ins-head .meta b { color: var(--ink-2); font-weight: 600; }
.ins-head .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ins-head .acts button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 11px; letter-spacing: .03em; white-space: nowrap; }
.st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.fail { color: var(--fail); } .st.mut { color: var(--muted); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.grid2, .grid3 { display: grid; gap: 8px 10px; margin: 8px 0; } .grid2 { grid-template-columns: 1fr 1fr; } .grid3 { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; } .field > span { color: var(--muted); font-size: 11px; }
.field select, .field input.num, .field input[type=text] { width: 100%; } .field.check input { width: 18px; height: 18px; }
.field.span2 { grid-column: span 2; } .field.span3 { grid-column: 1 / -1; }
h4 { margin: 14px 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.sub { color: var(--muted); font-size: 11.5px; margin: 4px 0; }
.note.fail { color: var(--fail); margin: 8px 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.chip { border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; font-size: 11.5px; color: var(--ink-2); }
.chip.ok { border-color: var(--ok); color: var(--ok); } .chip.fail { border-color: var(--fail); color: var(--fail); font-weight: 600; }
.elev-wrap { border: 1px solid var(--line); border-radius: 4px; padding: 4px; background: var(--plan-bg); }
.elev { width: 100%; height: auto; display: block; }
.elev .eb.ok { fill: var(--ok); opacity: .75; } .elev .eb.cant { fill: var(--l2); opacity: .8; } .elev .eb.fail { fill: var(--fail); }
.elev .et { font-size: 10px; fill: var(--ink); } .elev .et.small { fill: var(--muted); font-size: 9px; } .elev .et.strong { font-weight: 700; font-size: 11px; } .elev .et.fail { fill: var(--fail); font-weight: 700; }
.elev .el { fill: var(--ink); } .elev .el.ghost { opacity: .5; } .elev .el.inj { fill: var(--accent); }
.elev .es.hoist { fill: var(--l3); } .elev .es.bear { fill: var(--ink); }
.elev-wrap + .elev-wrap { margin-top: 6px; }
.forces .axis { stroke: var(--muted); stroke-width: 1; } .forces .limit { stroke: var(--fail); stroke-width: 1; stroke-dasharray: 4 3; opacity: .7; }
.forces .fd { fill: color-mix(in srgb, var(--accent) 22%, transparent); stroke: var(--accent); stroke-width: 1.2; }
.forces .fd.over { fill: color-mix(in srgb, var(--fail) 22%, transparent); stroke: var(--fail); }
.checks { display: grid; grid-template-columns: auto 1fr auto; gap: 5px 10px; align-items: center; margin: 8px 0 4px; }
.checks .n { color: var(--ink-2); }
.bar { height: 6px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; min-width: 40px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); }
.bar.w i { background: var(--warn); } .bar.f i { background: var(--fail); }
.checks .v { font: 11.5px var(--mono); text-align: right; min-width: 40px; }
.wl { display: flex; align-items: center; gap: 6px; justify-content: flex-end; } .wl .bar { width: 46px; } .wl span { font: 11.5px var(--mono); min-width: 32px; text-align: right; }
.big { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 4px; margin: 4px 0 8px; }
.big > div { padding: 7px 10px; border-right: 1px solid var(--line); }
.big > div:last-child { border-right: 0; }
.big b { display: block; font: 600 16px var(--mono); }
.big span { font-size: 11px; color: var(--muted); }
.big .w b { color: var(--warn); } .big .f b { color: var(--fail); } .big > div:nth-child(3) b { font-style: italic; }
.sub.hotline b { color: var(--warn); }
.sentence { padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel-2); margin: 6px 0; }
.sentence b { color: var(--ink); }
.outline .o { display: flex; align-items: center; gap: 8px; padding: 3px 6px; border-radius: 3px; cursor: pointer; }
.outline .o:hover { background: var(--accent-soft); }
.outline .o.l2 { padding-left: 26px; color: var(--ink-2); }
.outline .o .ic { width: 14px; text-align: center; color: var(--muted); font-size: 11px; }
.outline .o .r { margin-left: auto; font: 11.5px var(--mono); color: var(--muted); }
.faces { display: grid; grid-template-columns: 1fr 64px 1fr; grid-template-rows: auto 64px auto; gap: 6px; align-items: center; justify-items: center; margin: 6px 0; }
.faces .blk2 { width: 64px; height: 64px; background: var(--ink); border-radius: 3px; display: flex; align-items: center; justify-content: center; color: var(--panel); font-weight: 700; font-size: 11px; grid-column: 2; grid-row: 2; text-align: center; }

.viewctl { position: absolute; left: 10px; bottom: 44px; z-index: 5; display: flex; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--muted); }

.blk { fill: var(--ink); opacity: .9; stroke: var(--plan-bg); stroke-width: 1.5; cursor: pointer; }
.blk.bad { fill: var(--fail); }
.blockg.selected .blk { stroke: var(--accent); stroke-width: 3; }
.blockg.dim { opacity: .3; }

.poscell { display: flex; gap: 2px; align-items: center; }
.poscell select.ref { padding: 2px 1px; font-size: 11px; max-width: 58px; }
.linelen { margin: 2px 0 8px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.linelen b { color: var(--ink); }
.blockpick { display: flex; flex-direction: column; gap: 3px; width: 100%; }
.blockpick select { width: 100%; }

button.del { padding: 1px 6px; font-size: 11px; color: var(--muted); }
button.del:hover { color: var(--fail); border-color: var(--fail); }

.layout { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px 8px; margin: 6px 0 10px; background: var(--plan-bg); }
.layout h4 { margin-top: 8px; }
.seqrows { display: flex; flex-direction: column; gap: 2px; }
.seg { display: flex; align-items: center; gap: 6px; padding-left: 22px; }
.seg .mini { min-width: 110px; }
.cbrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.cbmark { width: 12px; height: 12px; background: var(--ink); border-radius: 2px; display: inline-block; }

.pieces { margin: 2px 0 6px 22px; }
.ptags { display: flex; flex-wrap: wrap; gap: 4px; margin: 3px 0; }
.ptag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 7px; background: var(--panel); cursor: pointer; font-variant-numeric: tabular-nums; }
.ptag i { font-style: normal; color: var(--muted); }
.ptag:hover { border-color: var(--fail); } .ptag:hover i { color: var(--fail); }
.pchips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
button.chip-btn { padding: 1px 7px; font-size: 12px; border-radius: 999px; }
.segbox { border-top: 1px dashed var(--line); padding-top: 2px; }

.notation { font-weight: 600; margin: 4px 0 8px; font-variant-numeric: tabular-nums; word-break: break-word; }
button.cb-ins { padding: 0 5px; font-size: 10px; border-radius: 4px; border: 1px dashed var(--line); color: var(--muted); background: none; }
button.cb-ins:hover { color: var(--ink); border-color: var(--accent); }


.tbl td.hi { color: var(--warn); font-weight: 700; }
.tbl td.mut { color: var(--muted, #777); }


.tbl th.r { text-align: right; }
.tbl.hoists th, .tbl.hoists td { white-space: nowrap; }
.tbl.trusses td.over { color: var(--fail); font-weight: 600; } .tbl.trusses td.near { color: var(--warn); font-weight: 600; }
.sum-h { margin: 12px 0 4px; } .chainbar { margin: 8px 0 4px; }
.tbl.hoists td input.num { padding: 1px 4px; margin: -2px 0; }
.tbl.hoists { display: block; overflow-x: auto; }

.tbl.loads td:last-child { white-space: nowrap; }
.tbl td.nowrap { white-space: nowrap; }
input.cbname { width: 110px; font-weight: 600; }
.quick { display: flex; gap: 6px; margin: 4px 0 2px; flex-wrap: wrap; }
.drag { cursor: grab; color: var(--muted); font-size: 16px; padding: 0 4px; user-select: none; }
.tbl th.sortable { cursor: pointer; text-decoration: underline dotted; }
.tbl tr.dragging { opacity: .4; } .tbl tr.dropat td { border-top: 2px solid var(--accent); }
input.num.bad { outline: 2px solid var(--fail); }
input.fxsearch { min-width: 220px; flex: 1; }
.fxpick { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
input.fxsearch.bad { outline: 2px solid var(--fail); }
.sheet .rplan .tr { stroke-linecap: butt; opacity: .85; } .sheet .rplan .tr.ok { stroke: #2e8b57; } .sheet .rplan .tr.fail { stroke: #c62828; }
.sheet .rplan .cb { fill: #333; } .sheet .rplan .ld { fill: #111; }
.sheet .rplan .ho { fill: #fff; stroke: #1f5fd1; stroke-width: 3; } .sheet .rplan .ho.fail { stroke: #c62828; }
.sheet .rplan text { font: 15px system-ui, sans-serif; fill: #111; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
.sheet .rplan .hn { font-weight: 700; fill: #1f5fd1; } .sheet .rplan .hn.fail { fill: #c62828; } .sheet .rplan .tn { font-weight: 600; font-size: 16px; }
.sheet .rplan .sb { stroke: #111; stroke-width: 2; } .sheet .rplan .sbt { font-size: 13px; fill: #444; }
.lfgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 10px; }
.deflg .defl, .iso .defl { fill: none; stroke: var(--tc, var(--accent)); stroke-width: 2; stroke-linejoin: round; } .deflg { --tc: var(--ok); pointer-events: visibleStroke; } .deflg.c-warn { --tc: var(--warn); } .deflg.c-fail { --tc: var(--fail); } .deflg.c-neutral { --tc: var(--neutral); } .deflg.dim { opacity: .25; }

</style>
</head>
<body>
<header class="appbar">
  <div class="logo"><b>Truss Grid Analyzer</b><small id="appver"></small></div>
  <div class="menu">
    <button class="ghost" data-pop="m-file">File ▾</button>
    <div class="pop" id="m-file" hidden>
      <button id="b-new">New rig</button>
      <button id="b-open">Open… <small>.rig.json</small></button>
      <button id="b-save">Save <small>.rig.json</small></button>
      <hr>
      <button id="b-sample">Load example box</button>
      <hr>
      <div class="hd lbl-sm">Theme</div>
      <button data-theme-set="dark">Dark</button>
      <button data-theme-set="light">Light</button>
      <button data-theme-set="system">Follow system</button>
      <hr>
      <button id="b-docs">About, method &amp; version history</button>
    </div>
  </div>
  <input type="file" id="f-open" accept=".json,application/json" hidden>
  <button id="rigname" title="Rig name - click to rename"></button>
  <span class="vr"></span>
  <button id="b-undo" class="ghost icon" title="Undo (Ctrl+Z)">↶</button>
  <button id="b-redo" class="ghost icon" title="Redo (Ctrl+Y)">↷</button>
  <span class="vr"></span>
  <div class="segc" id="views"><button data-view="plan" class="on">Plan</button><button data-view="iso">3D</button></div>
  <div class="menu">
    <button class="ghost" data-pop="m-calc" id="b-calc">Calculators ▾</button>
    <div class="pop" id="m-calc" hidden>
      <div class="hd lbl-sm">Standalone tools</div>
      <button data-tab="circular">Circular truss</button>
      <button data-tab="udl">Simple UDL</button>
      <button data-tab="fixtures">Fixture weights</button>
      <hr>
      <button data-tab="databases">Databases <small>trusses, blocks, hoists</small></button>
    </div>
  </div>
  <span class="grow"></span>
  <button class="verdict" id="verdict" title="Rig status - click for the results and warnings"></button>
  <span class="vr"></span>
  <button id="b-settings" title="Rig-wide settings: dynamic factor, Add %, hoist stiffness, repetitive-use, units">⚙ Rig settings</button>
  <div class="menu">
    <button data-pop="m-export">Export ▾</button>
    <div class="pop right" id="m-export" hidden>
      <button id="b-csv">Copy hoist table <small>for Excel</small></button>
      <button id="b-img">Save view as PNG</button>
      <button id="b-model" title="Save this rig's whole-rig model (JSON) to cross-check it in PyNite: python tools/pynite_check.py file">Export whole-rig model</button>
      <hr>
      <button id="b-print">Print screen</button>
    </div>
  </div>
  <button id="b-report" class="primary" title="A printable sheet with every input, formula, table lookup and check, so the calculation can be verified independently">Calc sheet</button>
</header>
<main id="main">
  <section class="stage">
    <div id="strip" hidden></div>
    <div class="ctool">
      <div class="stages" id="stages">
        <button data-step="1"><i>1</i>Structure <small data-n="1"></small></button>
        <button data-step="2"><i>2</i>Loads <small data-n="2"></small></button>
        <button data-step="3"><i>3</i>Hoists <small data-n="3"></small></button>
        <button data-step="4"><i>4</i>Results <small data-n="4"></small></button>
      </div>
      <button id="b-add" class="primary">+ Truss</button>
      <span class="grow"></span>
      <div class="box">
        <div class="segc" id="s-color" title="What the truss colours show">
          <button data-color="util">Workload</button><button data-color="hot" title="Shade each truss along its length by local workload, to find where it is loaded most">Hot spots</button><button data-color="defl" title="Colour each truss by its sag against its deflection limit, and draw its deflected shape (exaggerated) - beside it on the plan, above it in 3D">Deflection</button><button data-color="hoist">Hoists</button><button data-color="status">Pass/fail</button>
        </div>
        <label class="chk"><input type="checkbox" id="c-loads" checked> Loads</label>
        <label class="chk"><input type="checkbox" id="c-labels" checked> Labels</label>
      </div>
    </div>
    <div class="modebar" id="modebar" hidden></div>
    <div id="plan"></div>
    <div id="iso" hidden></div>
    <div class="viewctl" id="isoctl" hidden>3D view <label>Rotate <input type="range" id="r-yaw" min="-180" max="180" value="35"></label> <label>Tilt <input type="range" id="r-pitch" min="5" max="85" value="32"></label> <span>drag = orbit, shift+drag = pan</span></div>
    <div id="legend" class="legend"></div>
    <div class="zoomctl">
      <button class="icon" id="b-zin" title="Zoom in">+</button>
      <button class="icon" id="b-zout" title="Zoom out">−</button>
      <button class="icon" id="b-fit" title="Fit the rig in view (F)">⤢</button>
    </div>
    <div class="hint" id="hint">Click to select · drag a truss to move (ends snap, Alt = no snap) · drag a hoist along its truss · R = rotate · Del = delete · wheel = zoom</div>
  </section>
  <aside id="inspector"></aside>
  <section id="dock">
    <div class="dhead" id="dhead"></div>
    <div id="summary"></div>
  </section>
</main>
<section id="page" hidden></section>
<section id="report" hidden></section>
<dialog id="docs"></dialog>
<section id="setpage" hidden></section>
<script>
/* App version (MAJOR.MINOR.PATCH). MAJOR is set by the owner; MINOR (new features, or any change to calculated
 * results) and PATCH (fixes that don't change results, UI and text) are bumped with each change. Newest first.
 * Shown in the header and the About dialog, and written into saved rig files. The original program's license asks
 * every modified version's history to show who made the change, when, and what changed: [version, date, who, what]. */
(function (g) {
  var TLA = (g.TLA = g.TLA || {});
  TLA.VERSION = "1.25.0";
  TLA.CHANGES = [
    ["1.25.0", "2026-09-24", "G.E. Simmons Falk", "Calculation sheet: each truss now shows its deflection drawing (the exaggerated deflected shape from the whole-rig analysis, as in the truss panel's Checks) and a deflection check (new formula F7): each span's sag against its limit L/n, where it is, L/d, workload and status, plus the cantilever tips (reported only). Calculated results are unchanged."],
    ["1.24.0", "2026-09-24", "G.E. Simmons Falk", "Hoists grid (step 3): select several hoists (Shift+click for a range, Ctrl+click one at a time, Shift+arrows, Ctrl+A, or Select on a truss row) and any edit changes all of them - model, chain, DLF, hardware, Hangs from, level offset, reading - but not their positions; Ctrl+D copies the top selected hoist to the rest and Delete removes them all. A new hoist is now set up like the last hoist placed in the rig (model, chain or rope, hardware, DLF; not its name, level offset, Hangs from or reading) instead of always a 1 ton Lodestar. Calculated results are unchanged for existing rigs."],
    ["1.23.0", "2026-09-24", "G.E. Simmons Falk", "Hoists can be mirrored and copied like loads: Mirror (one hoist) and Mirror all add a hoist at the mirrored spot about the truss centerline; Copy to truss copies one or all hoists to another truss, keeping each one's distance from the centre (clamped to the ends). Unlike a mirrored load, each copy is a real hoist with its own name, result and load-cell reading; it keeps the model, chain or rope, dynamic factor, hardware, level offset and Hangs from. No copy is placed where a hoist already is. Calculated results are unchanged for existing rigs."],
    ["1.22.0", "2026-09-24", "G.E. Simmons Falk", "New features from comparing the app with Vectorworks Braceworks and Production Assist. Rigs that use none of them give exactly the same results as 1.21.0 (checked on the example box and four venue rigs). Hoists hung below a truss: a hoist's Hangs from can be another truss instead of the structure. Its chain joins the two trusses in the whole-rig analysis, so the upper truss (the carrier) sags with the load and the truss below shares load with its other hoists; the chain can only pull. The carrier carries the hung hoist's high hook load, and it - with everything bolted to it - is also checked with the hung hoist's high hook dynamic load; so are the hoists holding the carrier up, unless Rig settings turn that off. Rig totals count only hoists to the structure. Dead hangs: a support can be wire rope with no hoist. Pick the rope (7x19 galvanized aircraft cable or 6x19 IWRC, typical catalogue breaking strengths) and its length; WLL = breaking strength / design factor (Rig settings: 7, 8 or 10:1, default 10:1), capped by a typed assembly WLL; static (dynamic factor 1.0 unless typed); its weight is the rope and hardware; rigid, or a rope spring EA/L when the rig's hoists are springs. DH1, DH2... on the calc sheet. Hoist levels: a hoist can have a designed Level offset (inches, + higher) - a raked or trimmed truss - which the whole-rig analysis solves as that point moved; and an out-of-level tolerance in Rig settings (e.g. 1/4\") adds to every hoist's check the worst it could see if each hoist were that far off on its own, with a warning when the low side could go slack. Allowances: a cable weight per length (Rig settings, or per truss) added to each truss's UDL, and load factors by category (lighting, audio, video, scenic, rigging hardware, other; library fixtures are lighting). Check rig: on every change, a list of input mistakes - a load with no weight, two hoists at one point, a bolted assembly with fewer than 3 hoists or all in a line, bolted ends that don't meet, trusses that cross with no joint, a hoist with no model - in the rig panel and the warnings; the truss panel's Connected button dims everything not joined to it. Measured vs calculated: a load cell reading per hoist (hoist grid or panel), compared with the high hook static or low hook load (Rig settings) and totalled per assembly, flagged past 5%; readings never change a result. Deflection view: a Deflection colour mode colours each truss by its sag against its limit and draws its deflected shape, exaggerated, beside it on the plan and above it in 3D. Also: the calc sheet explains each of these; a hoist's load breakdown now lists Add %, hardware and the level allowance so it adds up; the whole-rig model export lists hung hoists (tools/pynite_check.py does not model them yet)."],
    ["1.21.0", "2026-09-24", "G.E. Simmons Falk", "Load-path method taken out of the display; hoist loads and every check are unchanged (they already came from the whole-rig analysis). Gone: the Load path column in the hoist grid (Compare analysis methods now shows the three joint models only), the Results hoist table, the hoist CSV and the calc sheet (hoist loads, bolted connections, truss reactions, the equilibrium row and the basis note), the load-path figure in a hoist's panel, and the warning that a hoist is well above the load-path result. The load-path method is still used, with its warning, when the whole-rig analysis can't run (a very large rig). Level sensitivity is no longer a column in the hoist grid, the Results hoist table, the hoist CSV or the calc sheet: it stays in each hoist's panel, and the level-sensitivity warning stays (in the app and the calc sheet)."],
    ["1.20.0", "2026-09-24", "G.E. Simmons Falk", "Truss checks now count the truss's own weight by default (the Rig settings switch is on unless a rig turns it off; saved rigs that turned it off keep it off). Cantilever check: the self weight is added to the cantilever's load, as the original workbook does. Moment and shear check: the moments and shears include the self weight, and so do the allowables estimated from the tables - each table row also demonstrates its own truss weight, w L^2/8 and w L/2 (Hall, Stress Table Creator 2): allowable moment = k x min(max CPL L/4 + w L^2/8, max UDL L/8 + w L^2/8), shear = k x max(CPL/2 + w L/2, UDL/2 + w L/2). With the switch off the check is net against net, as before. Results change: cantilever, moment and shear workloads go up a little (e.g. a 32 ft box side's cantilever 27% -> 33%); hoist loads do not change. The help and calc sheet no longer say the tables already subtract the truss weight; formula F3 shows the self-weight terms."],
    ["1.19.0", "2026-09-24", "G.E. Simmons Falk", "Interface redesign, plus new deflection results (see the end); hoist loads and the table, moment and shear checks are unchanged. Work in four steps shown above the plan - 1 Structure, 2 Loads, 3 Hoists, 4 Results - and jump between them at any time. Each step has a spreadsheet-style grid under the plan: every truss (type, pieces, position, UDL), every load grouped by truss, and every hoist with its results updating as you type. Tab / Enter / arrows move, typing edits, Ctrl+D fills down, Ctrl+V pastes rows from Excel, Delete removes a row; each edit is one Undo step. Loads: the item cell searches the fixture library (fixtures already on the rig first) and fills in the weight and clamp; type a weight (45 lb) for a custom load; one row per load position (weight + clamp = total); Mirror shows where the mirrored load lands and Mirror all works per truss; while you type, the plan shrinks to a strip of the truss being edited. The side panel now shows whatever you click: the rig (with an outline of every truss, corner block, hoist and load), a truss (sections in working order: truss, corner blocks, placement, loads, hoists, checks, advanced), a hoist (its result and where the load comes from, model, chain, dynamic factor, position), a corner block (a diagram of its faces and what is bolted to each) or a load. Bolt to... then click a corner block on the plan (or click a free face of a block, then the truss). Quick add a load: MAC Aura @ 4, 120 lb @ -6. The plan marks the origin with hard X 0 and Y 0 lines. The Hang order colouring is gone (the load-path order is still used inside the load-path method). Settings that apply to the whole rig (dynamic factor, Add %, hoist stiffness, repetitive-use, self weight, units, length format, calc sheet paper) moved to one Rig settings panel; units are set only there. Menus: File (new, open, save, example, theme, about), Calculators (circular truss, simple UDL, fixture weights, databases), Export (hoist table, PNG, whole-rig model, print). Dark theme by default, light or follow-system under File. Number keys 1-4 switch step, F fits the plan. New results (nothing existing changes): the deflected shape of every truss from the whole-rig analysis, each span's sag against the maker's published limit (Tomcat L/100; JTE L/160 where the sheet states it) or the rig default L/160 (Rig settings): past a maker's limit the truss is Overloaded (their allowable loads are set by it), past the rig default it is a warning; a Hot spots colour mode that shades each truss along its length by local workload; and in a truss's Checks a local-workload strip with the peak, a reaction diagram and a deflection diagram. Rig settings is now a full page. Hot spots: each span's table check follows the shape of its bending moment, so the colour peaks under the loads that work the truss hardest, with a glow at the peak of any truss at 80% or more. Hoists on the plan are drawn as a ring with cross-hairs in their own colour (white in the dark theme, dark in the light one; amber when high, red when overloaded), labelled with the high hook static load and, in italics under it, the high hook dynamic load. A hoist's panel shows its low hook, high hook static and high hook dynamic loads at the top, with the level sensitivity on its own line. A new truss starts with no hoists (hoists are placed in step 3). Where the app quotes a maker (a truss's source, its deflection limit, the list of makers' limits in Rig settings) it links to the maker's own data sheet, opened in a new tab. Rig settings has a Center on 0,0 button that moves the whole rig so the middle of its footprint is at the origin (bolted parts follow; results unchanged). Theme (dark, light, follow the computer) is also in Rig settings."],
    ["1.17.1", "2026-09-24", "G.E. Simmons Falk", "Tests only, no result changes: the Rigging Math Made Simple 3D grid example is now also checked against Production Assist 1.13.10's calculation of the same grid (Derek Epstein). Given Production Assist's own inputs (its 12x12 section, rigid joints, the hoists' wire-rope springs), the whole-rig analysis gives the same hoist loads to within 0.5 lb, and section properties computed from 2 x 0.125 in chords match Production Assist's 12x12 section."],
    ["1.17.0", "2026-09-24", "G.E. Simmons Falk", "Calculation sheet: every check is now written out the way you would check it by hand - formula, then the numbers put into it, then the result - with real fractions and subscripts: the span and cantilever checks (length, UDL share f, capacity C = CPL x k x f, load against C with its workload) and the moment and shear check (allowed moment and shear from the tables, then the largest moment and shear against them), plus the formula list F1-F5 in section 2. Which table rows were read is noted under each check. The hoist load table (4b) and the other wide tables now fit the page. New Calc sheet paper option in the rig setup: Letter (8.5 x 11 in) or A4 (210 x 297 mm), whichever units you use (Letter for imperial and A4 for metric until you pick); the sheet is laid out and printed on that size. No result changes."],
    ["1.16.0", "2026-09-23", "G.E. Simmons Falk", "Databases tab: trusses and corner blocks are now one searchable table, filtered by type (trusses, corner blocks or both) and maker. Click a family to see a truss together with the corner blocks that fit it. Every manufacturer truss links to the maker's own load table or cut sheet on their website (Christie Lites, James Thomas Engineering, Tomcat, Tyler Truss), and corner blocks link to the product page; workbook trusses are marked \"workbook\", and hovering a row shows where its numbers come from. Your own trusses and corner blocks appear in the same table and are added below it. Fix: 22 James Thomas corner-block links no longer opened (JTE's addresses use the x and degree signs). No calculation changes."],
    ["1.15.1", "2026-09-23", "G.E. Simmons Falk", "Calculation sheet: the boxed sign-off blocks (with Signature and Date lines) are gone; the end of the sheet just leaves a space for the Prepared by and Checked by names (filled in from the sheet's fields when given), and its last line now names G.E. Simmons Falk as the author of Truss Grid Analyzer alongside Hall and Sogoian as the originators, as the license asks. No result changes."],
    ["1.15.0", "2026-09-23", "G.E. Simmons Falk", "Wording and display, no result changes. The grillage / stiffness solve is now called the whole-rig analysis (Export whole-rig model); the load-path method stays as the reference. Load against capacity is workload everywhere (was utilization / % cap), and the plan key reads Low / High (80%+) / Overloaded. Statuses read the same for trusses and hoists: OK, Overloaded, Too long, Slack, Unstable (was Good, OVERLOADED, TOO LONG!, FAILURE, SLACK, UNSTABLE; FAILURE = too long and overloaded) - the pass/fail rules are unchanged. Load-path layer numbers are gone from the tables, truss chips and plan tooltip: each truss now shows what it hangs from (the trusses and corner blocks it is bolted to, and its hoists). The plan is coloured by workload by default; the old layer colouring is kept as Hang order. Fix: typed lengths written with words (12 ft, 6 in, 12 ft 6 in) were rejected - they are read now."],
    ["1.14.1", "2026-09-23", "G.E. Simmons Falk", "Wording only, no result changes: one name per thing, lined up with the terms Vectorworks Braceworks and Production Assist use. Hoist everywhere (no more \"motor\"). The hoist loads are now the low hook load (R, what the truss hangs on the hook) and the high hook load (low hook + Add % + hoist, chain and hardware weight, what the structure above carries), static and dynamic, in the hoist table, CSV export, selected-hoist panel and calculation sheet. The Trim column is now Level sensitivity (the change in a hoist's load if it runs 1/4 in high or low), since trim means a height. Wall / wall weight is now UDL (formula symbol w_udl). Truss \"own weight\" is self weight."],
    ["1.14.0", "2026-09-23", "G.E. Simmons Falk", "Calculation sheet: a new Calc sheet button opens a printable record of the rig's calculations so they can be verified and checked independently - a title block (project, venue, prepared / checked by, date, software version and an input fingerprint that changes with any input), a summary, the basis of calculation with every formula used, a plan drawn to scale with the hoists numbered H1, H2..., each hoist's reaction from every joint model and its static and dynamic load worked out part by part, the equilibrium self-checks, and for every truss its data, the loads it carries (including those from bolted trusses), its reactions and balance, statics for a truss on two supports, the diagrams, each span and cantilever check with the table row read and the arithmetic written out, and the moment and shear check with the table rows the allowables come from. Also the bolted connection forces, the corner blocks, how to check the rig independently, all warnings, and signature boxes. Print it or save it as PDF. It only shows what the app already calculates: no result changes."],
    ["1.13.0", "2026-09-23", "G.E. Simmons Falk", "Plan view: truss names run along their truss (turned so they never read upside down). Chain lengths: a Chain column in the hoist table to type each motor's chain (Tab or Enter goes to the next motor), and a box to set every motor's chain - or just the selected truss's - at once, as one Undo step. New Trusses table under the hoist table: for every truss its type, layer, length, longest span against the table maximum, the worst span and cantilever use, moment and shear use, the largest bending moment, which joint model of the stiffness solve it was checked with, and its status (click a row to select the truss). No calculation changes."],
    ["1.12.0", "2026-09-23", "G.E. Simmons Falk", "Corner-block rules from the maker: Christie Lites' A Type corner-block data says a box truss built with 90-degree corner blocks must be supported at every corner, and that where an unsupported 90-degree block or 6-way hub joins 4 truss sections (hub: 6) only half (a third) of the truss table capacity applies. A box whose corner blocks have no hoist at them now gets one warning naming them, and such a block gets a warning with the reduced share. These are flags only: every check and result is shown exactly as before, at the full table capacity. \"At\" a block means a hoist on the block, on its truss within its footprint + 6\", or on a bolted truss within 6\" of the bolted end."],
    ["1.11.0", "2026-09-23", "G.E. Simmons Falk", "Christie B Type and F Track follow Christie's own spec: the two entries now carry Christie's current load table, repetitive-use flag and weight (the same entries, so saved rigs follow). The workbook's rows were older tables that allow more than Christie's - B Type's 8 ft centre point load 6400 lb against Christie's 5851, F Track about double everywhere, at 26.5 lb/ft against 16.6 - so only flipping their repetitive-use flag would have been unsafe. The separate B and F manufacturer rows added in 1.10.0 now have the same data and are hidden from the pickers; they are kept, like every id, so rigs saved in 1.10.0 still open. This also puts back the truss entry numbers released in 1.10.0 (a second 1.10.0 merge had renumbered 50 manufacturer entries, which would have opened some saved rigs with the wrong truss). Results change for rigs using these two trusses."],
    ["1.10.0", "2026-09-23", "G.E. Simmons Falk", "Manufacturer truss data: 51 trusses from the makers' own load tables (Christie Lites A, B, C, D, E, F, G and H Type; James Thomas Engineering General Purpose, SuperTruss, Pre-Rig and Galaxy; Tyler Truss Standard, T2, AV+, AV-HD, Stackmaster, T-Max, Medium and Super Duty, Centerline, GT, GTX, Video and Cable truss), marked MFG and listed first when picking a truss. Each truss and corner block now carries its product line, so the bolted-parts check knows that the workbook's and the maker's rows of one line (e.g. Christie A Type) bolt together. Comparing the workbook's rows with the makers' tables found that some allow more than the maker does (Christie A Type at 11-13 ft, F and G Type; JTE GP 18x12, SuperTruss 20.5x30 and GP Pre-Rig; Tomcat 12x12 spigoted; Tyler GT+ and Stackmaster 12x12): a truss on such a row now gets a warning naming the span and the maker's row. Two workbook rows are corrected from the makers' sheets, so their results change: the Christie A Type row repeated its 8 ft uniform load at 11-13 ft (3360 lb) - now Christie's 1680 lb; and JTE SuperTruss 20.5x30 was treated as already reduced for repetitive use, while JTE's sheet asks for the 0.85 - now applied (15% lower capacity). The other workbook rows' repetitive-use flags are as in the latest workbook, TLA-EOT 2.4."],
    ["1.9.1", "2026-09-23", "G.E. Simmons Falk", "Side panel: the \"Truss and length\" and \"Corner blocks\" sections of a selected truss are now one section, \"Truss, length and corner blocks\", since both set up the same line. Nothing else changes."],
    ["1.9.0", "2026-09-23", "G.E. Simmons Falk", "Hoists can be dragged along their truss in the plan view, in 1\" steps (2 cm in metric), counted from the truss's measuring reference (start, centerline or end) so the distance stays a round number; the position is shown next to the hoist while dragging and the rig is solved again as it moves. Clicking a hoist still just selects it. No calculation changes."],
    ["1.8.0", "2026-09-23", "G.E. Simmons Falk", "Bolted parts check: bolted truss and corner blocks only fit within one manufacturer's truss family, so a truss bolted to a block, a block in a truss run, or a truss bolted straight to another truss is now warned about when the parts don't match (for example JTE 12x12 into a Christie A Type block, or SuperTruss into a General Purpose block), and the bolt is drawn red on the plan. A generic or universal truss bolted to branded parts is warned about too. Generic, universal and custom parts that can't be checked get a note (listed apart, not counted as warnings). Trusses stacked on top or clamped below are not checked - any family can sit on another. Warnings only: nothing is blocked, and no loads or checks change."],
    ["1.7.0", "2026-09-23", "G.E. Simmons Falk", "Metric or imperial: a Units switch in the toolbar (saved with the rig) shows and takes every length, weight, load, moment, hoist speed and size in feet and pounds or in metres and kilograms (kg·m, m/min, mm). It only converts what is shown and typed - the rig is still stored and solved in feet and pounds, so switching changes no result and no truss, hoist or fixture choice. Lengths can be typed as metres, cm or mm (feet-inches still work). Warnings, the hoist table and its CSV copy follow the switch. A custom truss is saved in the units it is entered in (metric trusses keep their own metric table)."],
    ["1.6.0", "2026-09-23", "G.E. Simmons Falk", "Truss database: every truss now records where its numbers come from - the Truss Load Analyzer workbook (TLA, with the version) or the manufacturer's own data sheet (MFG) - and whether its table is native imperial or metric; the Databases tab lists them all. Added from EOT 2.4: Prolyte S36 PRT with and without wheels (EOT 2.4 has their weights swapped; corrected from its own metric rows) and Total Structures Totalite 11.5\", and EOT 2.4's metric database - 101 trusses from CLS, Eurotruss, Global Truss, HOF, Litec, Milos and Prolyte (Eurotruss HD44 left out: no weight). Metric trusses are checked against their own table in whole-metre steps (span rounded up to the next metre) and get the usual 0.85 repetitive-use derate (EOT 2.4 applies none to metric trusses). Their model numbers are no longer read as inches; their size is unknown, so the stiffness solve assumes a 20.5 in box and says so. Added from Tomcat's published data sheets (L/100 deflection-limited, 2024-2026): Light Duty 12x12 Plated, Spigoted, Guardian and Guardian+ (already reduced for repetitive use), Medium Duty 20.5x20.5 Plated and the 20.5 Triangle Plated and Spigoted, with chord sizes where the sheet gives them; a span between table rows uses the next longer row. The workbook's older Tomcat entries are kept alongside for comparison. Existing trusses' numbers are unchanged."],
    ["1.5.0", "2026-09-23", "G.E. Simmons Falk", "Stiffness solve: the tiny twist stiffness that keeps a truss from spinning about its own axis (which nothing loads) is now sized for each joint from that truss's own stiffness, instead of from the stiffest point anywhere in the rig, and the solver's singularity test is likewise relative to each joint. A very short element (a 0.002 ft stub, without shear deformation as in the PyNite export) could make it stiff enough to hold up a soft pipe, and the rig was then wrongly reported UNSTABLE. Hoist loads move by less than 0.00001 lb on the test rigs; a rig can now pass that was falsely flagged. From Truss Load Analyzer - EOT 2.4 (Sogoian, Multi v1.24): the hoist dynamic factor from speed is now fpm / 60 + 1 (16 fpm = 1.267, was fpm / 64 + 1 = 1.25), which raises dynamic loads by about 1.3% at 16 fpm; an optional 'Add %' on hoist loads (the load and truss weight at each hoist, before hoist and chain weight); new trusses Prolyte H30 Verto and the generic Universal 12\"x12\" bolted, 20\"x20\" bolted and 26\" x 30\" PRT, which carry a 0.75 derate on their table capacities. EOT 2.4's span check multiplies the span-table row number by the derate instead of the capacity, which reads a shorter span and skips the derate; that is not copied - capacities are derated as before."],
    ["1.4.0", "2026-09-22", "G.E. Simmons Falk", "Stiffness solve: truss stiffness, shear, trim, hoist springs and semi-rigid corner blocks. Each truss's bending stiffness is now estimated from its manufacturer's tables (the largest table moment carried by its chords; it grows with about depth squared, not depth cubed as before), with shear and torsion stiffness from an estimated diagonal lattice, and real chord/diagonal sizes in the truss data can replace the estimate. Trusses are Timoshenko beams (shear deformation: large on short spans). Corner blocks are also solved as semi-rigid rotational springs (1, 4 and 16 x EI/L) between hinged and rigid, and every check uses the worst. New: the load change on each hoist when it runs 1/4\" high (trim), with a warning past 10% of its capacity; an optional hoist stiffness (lb/in); an export of the stiffness model and tools/pynite_check.py, which rebuilds it in PyNite (the engine behind CalcForge 3D) and compares - it agrees to 0.01 lb on the test rigs. Changes hoist loads and member forces wherever trusses share load (grids, and single trusses on three or more hoists)."],
    ["1.3.0", "2026-09-22", "G.E. Simmons Falk", "The stiffness (grillage) solve of the whole rig is now the primary result instead of a check: hoist loads, the forces in bolted connections, the loads every span and cantilever check sees, and the bending moment and shear the 1.2.0 moment/shear check uses (including moment carried through rigid corner blocks) all come from it. Hinged and rigid joints are shown side by side and every check uses the worse of the two; the load-path numbers of the original workbook are kept as a reference column. Changes results on grids where a carrying truss sags (single trusses on hoists are unchanged). Also: torque along every truss from the stiffness solve, a hoist's load breakdown from the same solve, a self-check that the connection forces balance, and a clear fallback to the load-path method when the stiffness solve can't run."],
    ["1.2.0", "2026-09-22", "G.E. Simmons Falk", "Shear and bending-moment diagrams for every truss, and a moment/shear check against an allowable moment and shear estimated from the manufacturer's tables. It catches what the span-by-span table check can't: bending over the supports of a continuous truss, and heavy loads right next to a support. Can flag trusses the table check passed. The 'count truss weight' option now also applies to this check."],
    ["1.1.0", "2026-09-22", "G.E. Simmons Falk", "Chain hoists can only pull: a hoist the load would push up is now shown as Slack, taken out, and the truss solved again (both the load-path and the stiffness check); a truss or rig that would tip is flagged UNSTABLE instead of showing loads. Changes results where a hoist used to show a negative load. Stiffness check fixes: hardware weight at bolted connections and loads hung on corner blocks were missing; it now checks its own balance and total against the load path, names any truss that isn't held up, and no longer lets a truss on a single hoist pass. Test added for the Rigging Math Made Simple 3D grid example."],
    ["1.0.0", "2026-09-22", "G.E. Simmons Falk", "First numbered release of Truss Grid Analyzer, a web rebuild of Truss Load Analyzer - EOT: truss-grid load paths through corner blocks, plan and 3D views, manufacturer-table span/cantilever checks, hoist checks, the grillage stiffness check (hinged and rigid joints, stiffness estimated per truss connector type), and the license file (LICENSE.md)."]
  ];
})(typeof globalThis !== "undefined" ? globalThis : window);

    if (w) box.appendChild(calcs(null, [mcmp("Worst span", [mv("d"), " (span " + w.index + ")"], IN(w.max), [fr(mv("L"), String(dc.ratio)), " = " + IN(w.allowed)], w.util <= 1 + 1e-9, pct(w.util) + " workload")],

  /** A plan drawn for paper (not a copy of the screen): trusses to scale, coloured pass / fail, corner blocks,

    var y1 = Math.min.apply(null, pts.map(function (p) { return p.y; })), y2 = Math.max.apply(null, pts.map(function (p) { return p.y; }));

    });
    rig.trusses.forEach(function (t) {
      if (!t.isBlock) return;
      var c = G.endPoint(t, (t.length || 0) / 2), half = Math.max(4, (t.length || 1) * sc / 2);
      add("rect", { x: X(c) - half, y: Y(c) - half, width: half * 2, height: half * 2, "class": "cb", transform: "rotate(" + (-(t.angle || 0)) + " " + X(c) + " " + Y(c) + ")" });
    });
    rig.trusses.forEach(function (t) {
      (t.supports || []).forEach(function (s) {
        if (s.kind !== "hoist") return;
        var p = G.endPoint(t, s.distance), id = hid[t.id + ":" + s.id], x = S.results.hoists.filter(function (q) { return q.truss === t.id && q.support === s.id; })[0];
        var bad = x && x.hoist.status !== "Good";
        add("circle", { cx: X(p), cy: Y(p), r: 9, "class": "ho" + (bad ? " fail" : "") });
        add("text", { x: X(p) + 11, y: Y(p) - 11, "class": "hn" + (bad ? " fail" : "") }, id || "");
      });
    });
    labels.forEach(function (l) { add("text", { x: l.x, y: l.y, "class": l.cls, "text-anchor": "middle", "dominant-baseline": "middle", transform: l.rot ? "rotate(" + l.rot + " " + l.x + " " + l.y + ")" : "" }, l.text); });
    // scale bar: a round length about a fifth of the drawing
    var metric = U.metric(), unitFt = metric ? 1 / FT_M : 1, target = span / 5 / unitFt, steps = [1, 2, 5, 10, 20, 25, 50, 100], len = steps[0];
    steps.forEach(function (v) { if (v <= target) len = v; });
    var bx = pad, by = VH - 18, bl = len * unitFt * sc;
    add("line", { x1: bx, y1: by, x2: bx + bl, y2: by, "class": "sb" }); add("line", { x1: bx, y1: by - 5, x2: bx, y2: by + 5, "class": "sb" }); add("line", { x1: bx + bl, y1: by - 5, x2: bx + bl, y2: by + 5, "class": "sb" });
    add("text", { x: bx + bl + 8, y: by + 4, "class": "sbt" }, len + (metric ? " m" : " ft"));
    add("text", { x: VW - pad, y: by + 4, "class": "sbt", "text-anchor": "end" }, "Plan, to scale. Green: truss checks pass, red: a check fails. Circles: hoists; squares: corner blocks; dots: loads.");
    return h("div", { "class": "rfig plan" }, svg);

  /* ---------------------------------------------------------------- overlay */

    sheet.classList.add("paper-" + paper());
    host.appendChild(sheet);
    var css = $("report-page") || document.head.appendChild(h("style", { id: "report-page" }));
    var foot = (S.rig.name || "rig") + " - Truss Grid Analyzer v" + TLA.VERSION + " - " + fingerprint(S.rig);
    css.textContent = "@page { size: " + PAPER[paper()].page + " portrait; @bottom-left { content: " + JSON.stringify(foot) + "; font: 8pt system-ui, sans-serif; color: #555; } @bottom-right { content: \"Page \" counter(page) \" of \" counter(pages); font: 8pt system-ui, sans-serif; color: #555; } }";
    host.hidden = false;
    document.body.classList.add("report-open");

  function close() {
    var host = $("report");
    if (host) { host.hidden = true; host.textContent = ""; }
    var css = $("report-page"); if (css) css.parentNode.removeChild(css);   // its page footer belongs to this sheet only

  }

  TLA.report = {
    mount: function (store) {
